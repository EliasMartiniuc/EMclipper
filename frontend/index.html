<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Clipper</title>
    <!-- Import separated CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="mouse-glow" id="mouseGlow"></div>

    <div class="container">
        <div class="header">
            <h1>AI Video Clipper</h1>
            <p class="subtitle">Transform long videos into viral 9:16 Shorts instantly.</p>
        </div>

        <!-- Input Section -->
        <div class="input-card">
            <div class="input-group">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);">
                    <path
                        d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z">
                    </path>
                    <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
                </svg>
                <input type="text" id="urlInput" placeholder="Paste YouTube URL here..." autocomplete="off" />
            </div>

            <div class="toggle-wrapper">
                <label class="toggle-label" title="Generate and burn-in karaoke subtitles">
                    <input type="checkbox" id="subtitlesToggle" class="toggle-checkbox" checked />
                    Subtitles
                </label>
            </div>

            <button class="btn" id="processBtn">Generate Clips</button>
            <button class="btn-stop" id="stopBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"
                    style="margin-right:6px">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                </svg>
                Stop
            </button>
        </div>

        <!-- Error Banner -->
        <div class="error-banner" id="errorBanner"></div>

        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <div class="status-dot" id="statusDot"></div>
            <div class="status-text" id="statusText">Processing...</div>
        </div>

        <!-- Log Console -->
        <div class="log-section" id="logSection">
            <div class="section-header">Pipeline Log</div>
            <div class="log-console" id="logConsole"></div>
        </div>

        <!-- Output Clips -->
        <div class="clips-section" id="clipsSection">
            <div class="section-header">Generated Clips</div>
            <div class="clips-grid" id="clipsGrid"></div>
        </div>
    </div>

    <!-- Import separated JS -->
    <script src="/static/app.js"></script>
</body>

</html>
